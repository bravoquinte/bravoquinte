<h1>À propos de Bravo Quinté</h1>
<p class="meta">Qui sommes-nous, comment fonctionne Bravo Quinté.</p>
<div class="card">
<p><strong>Bravo Quinté</strong> est un projet indépendant né de la passion pour les courses hippiques françaises. Nous publions chaque matin un pronostic gratuit pour le Quinté+ du jour, construit à partir d'une méthodologie rigoureuse.</p>
<p>Notre ambition : offrir une alternative sérieuse et transparente aux pronostics gratuits. Pas de "chevaux garantis", pas de couverture médiatique excessive — juste une analyse honnête des partants, avec un suivi des résultats.</p>
</div>
<h2>L'équipe</h2>
<p><strong>Pierre Melin</strong> — analyste turfiste. Expérience en courses hippiques depuis 2018. Spécialisé dans le Quinté+ galop et trot. Rédacteur principal des analyses quotidiennes.</p>
<p>Pour nous contacter : <a href="mailto:bravoquinte@gmail.com">bravoquinte@gmail.com</a></p>
<h2>Notre méthode</h2>
<p>Voir la page dédiée : <a href="methodologie.html">Méthodologie des pronostics</a>.</p>
<h2>Transparence</h2>
<div class="card"><ul>
<li>Les arrivées officielles sont publiées dans l'onglet <a href="resultats.html">Résultats</a>.</li>
<li>Les articles contiennent des analyses argumentées, pas de simples listes.</li>
<li>Un contrôle d'intégrité automatique vérifie la cohérence des données avant chaque publication.</li>
<li>La méthode est décrite publiquement dans la <a href="methodologie.html">Méthodologie</a>.</li>
</ul></div>
<p>Pour toute question, correction ou signalement d'erreur, écrivez-nous à <a href="mailto:bravoquinte@gmail.com">bravoquinte@gmail.com</a>. Nous répondons sous 48h.</p>
